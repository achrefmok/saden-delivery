<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b2a4e">
<meta name="description" content="SADEN Delivery — plateforme logistique : agence, livreurs, boutiques et suivi client.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SADEN">
<title>SADEN Delivery</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/brand/favicon-64.png" type="image/png" sizes="64x64">
<link rel="icon" href="/brand/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
html,body{margin:0;background:#0d1426;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{min-width:0}
button{touch-action:manipulation}
[data-sd]{--r:6px;--pad:12px;--gap:16px;--fs:13px;--kpi:26px;--font:'IBM Plex Sans','IBM Plex Sans Arabic',sans-serif;--disp:'IBM Plex Sans','IBM Plex Sans Arabic',sans-serif;--mono:'IBM Plex Mono',monospace;
--bg:oklch(0.975 0.004 255);--surface:oklch(0.997 0.002 255);--surface2:oklch(0.955 0.007 255);--ink:oklch(0.22 0.04 262);--mute:oklch(0.47 0.03 262);--line:oklch(0.9 0.01 262);
--navy:oklch(0.27 0.075 262);--orange:oklch(0.72 0.17 50);--onOrange:oklch(0.18 0.03 262);--stripe:oklch(0.9 0.012 262);--hdr:var(--surface);--hdrInk:var(--ink);
--gb:oklch(0.94 0.05 150);--gf:oklch(0.4 0.1 150);--ob:oklch(0.94 0.05 60);--of:oklch(0.47 0.14 45);--ib:oklch(0.94 0.03 258);--if:oklch(0.42 0.12 262);--rb:oklch(0.94 0.04 25);--rf:oklch(0.48 0.16 25);--wb:oklch(0.95 0.06 92);--wf:oklch(0.44 0.09 75);--nb:var(--surface2);--nf:var(--mute)}
[data-sd][data-theme="dark"]{--bg:oklch(0.17 0.03 262);--surface:oklch(0.21 0.035 262);--surface2:oklch(0.25 0.035 262);--ink:oklch(0.95 0.01 262);--mute:oklch(0.74 0.02 262);--line:oklch(0.31 0.03 262);--navy:oklch(0.13 0.035 262);--stripe:oklch(0.27 0.03 262);
--gb:oklch(0.32 0.06 150);--gf:oklch(0.88 0.1 150);--ob:oklch(0.34 0.07 50);--of:oklch(0.88 0.11 60);--ib:oklch(0.32 0.06 262);--if:oklch(0.88 0.07 262);--rb:oklch(0.33 0.07 25);--rf:oklch(0.88 0.09 25);--wb:oklch(0.34 0.06 90);--wf:oklch(0.9 0.09 92)}
[data-sd][data-d="b"]{--r:14px;--pad:18px;--gap:22px;--fs:14.5px;--kpi:34px;--font:'Manrope','IBM Plex Sans Arabic',sans-serif;--disp:'Manrope','IBM Plex Sans Arabic',sans-serif}
[data-sd][data-d="c"]{--r:3px;--pad:14px;--gap:14px;--fs:14px;--kpi:42px;--font:'Barlow','IBM Plex Sans Arabic',sans-serif;--disp:'Barlow Condensed','IBM Plex Sans Arabic',sans-serif;--hdr:var(--navy);--hdrInk:oklch(0.98 0.005 262)}
a{color:var(--orange)} a:hover{color:var(--ink)}
.fld{padding:10px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.fld:focus,.btn:focus-visible{outline:2px solid var(--orange);outline-offset:1px}
.map{position:relative;isolation:isolate;overflow:hidden;background:repeating-linear-gradient(135deg,var(--stripe) 0 1px,transparent 1px 12px),var(--surface2)}
.map .leaflet-container{background:var(--surface2);font:inherit}
[data-theme="dark"] .map .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:2000;max-width:min(92vw,460px);padding:12px 16px;border-radius:10px;font-weight:600;box-shadow:0 10px 30px oklch(0 0 0 / .3)}
/* responsive */
@media (max-width:900px){
  .split{grid-template-columns:minmax(0,1fr)!important}
  .span2{grid-column:auto!important}
  .shell{flex-direction:column!important}
  .shell>.nav-side,.shell>.nav-rail{width:auto!important;flex-direction:row!important;overflow-x:auto;padding:8px!important;gap:4px!important;position:sticky;top:0;z-index:5}
  .shell>.nav-side>.nav-meta,.shell>.nav-rail>.nav-logo{display:none!important}
  .shell>.nav-side>button{width:auto!important}
  .shell>nav{position:sticky;top:0;z-index:5}
  .pg{padding:14px!important}
  .hdr{padding:12px 14px!important}
  .hdr h1{font-size:20px!important}
}
@media (max-width:700px){ .hide-sm{display:none!important} .topbar{padding:8px 12px!important;gap:8px!important} }
@media print{ .no-print{display:none!important} body,[data-sd]{background:#fff!important} .pg{padding:0!important} }
</style>
</head>
<body>
<div id="root"></div>
<script src="/brand/brand.js"></script>
<script src="/js/app.js"></script>
<script src="/js/geo-admin.js"></script>
<script src="/js/pricing.js"></script>
<script src="/js/scan.js"></script>
<script src="/js/barcode.js"></script>
<script src="/js/manifests.js"></script>
<script src="/js/stock.js"></script>
<script src="/js/partners.js"></script>
<script src="/js/cash.js"></script>
<script src="/js/stats.js"></script>
<script src="/js/search.js"></script>
<script src="/js/journal.js"></script>
<script src="/js/claims.js"></script>
<script src="/js/notifications.js"></script>
<script src="/js/ops.js"></script>

</body>
</html>
